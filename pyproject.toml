[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cat-agent"
version = "0.1.0"
description = "Experimental local LLM agent runtime"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6,<7",
    "websockets>=12,<17",
]

[project.optional-dependencies]
litert = ["litert-lm>=0.16"]
notifications = ["firebase-admin"]
mcp = ["mcp==2.2.0", "jsonschema>=4.23,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 96

