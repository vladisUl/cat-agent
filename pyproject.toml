[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cat-agent"
version = "0.1.0"
description = "Experimental local LLM agent runtime"
requires-python = ">=3.10"
dependencies = [
    "websockets>=12,<16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 96
